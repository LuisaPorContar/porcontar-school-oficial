id:'science', nombre:'Claude Science', quien:'Propietario o Propietario Principal',
intro:'Entorno de trabajo para científicos e investigadores, en beta. Los cambios llegan a la aplicación de cada miembro en pocos minutos, y si una aplicación no logra conectarse durante 72 horas pausa los conectores personalizados y la memoria hasta que vuelva a conectarse. Aplica a quienes tengan la versión 0.1.41 o posterior. Mientras el primer interruptor esté apagado, todo lo demás aparece como No disponible.',

 {titulo:'Habilitar Claude Science para tu organización', rec:'desactivar', resumen:'Manda sobre toda la sección: apagado, el resto queda No disponible.',

 {titulo:'Permitir conectores personalizados', rec:'desactivar', resumen:'Anula el bloqueo de conectores personalizados de la organización.',

  criterio:'Habilita las dos o tres que el equipo de verdad vaya a usar. Una lista larga en la incorporación no ayuda a nadie.',

 {titulo:'Permitir habilidades personalizadas', rec:'decidir', resumen:'También quedan disponibles en claude.ai para quien las creó.',

 {titulo:'Acceder al trabajo guardado antes en la computadora', rec:'decidir', resumen:'Proyectos y sesiones de un plan personal anterior.',

 {titulo:'Administrar lista de permitidos de red', rec:'activar', resumen:'O la controlas tú, o cada miembro controla la suya.',

 {titulo:'Espejo de paquetes de la organización', rec:'info', resumen:'Dos URL: canal de Conda e índice de PyPI.',

 {titulo:'Qué son los plugins y cómo se agregan', rec:'info', resumen:'Paquetes que agrupan habilidades, conectores y subagentes.',

S.push({
id:'conectores', nombre:'Conectores', quien:'Propietario o Propietario Principal',
intro:'Las herramientas externas a las que Claude puede llegar, desde correo y calendario hasta diseño y repositorios.',
items:[
 {titulo:'Qué son los conectores y cómo se agregan', rec:'info', resumen:'Las herramientas externas a las que Claude puede llegar.',
  que:'Un conector es un puente entre Claude y una herramienta que el equipo ya usa: el correo, el calendario, Drive, Canva, el CRM. Con el conector puesto, Claude lee y escribe ahí mismo en vez de que alguien copie y pegue de una ventana a otra. También puedes conectar un servidor MCP propio, que es un conector hecho a la medida del negocio. La pantalla es una lista con buscador y filtros, y el único botón es Agregar. La columna Authorization indica que cada persona se autentica por su cuenta: que el conector esté en la lista no significa que alguien ya tenga acceso.',
  criterio:'Lo que gana la organización: que Claude trabaje con los datos reales de la empresa y no con lo que alguien alcanzó a pegar en el chat. Ahí se acaba el "dónde quedó ese archivo". Agrega solo lo que el equipo usa de verdad, porque cada conector activo ocupa espacio en cada conversación, y recuerda que los personalizados conectan Claude con servicios que Anthropic no ha verificado: ninguno debería entrar sin que un propietario lo revise.',
  fuente:{t:'Usar conectores para ampliar las capacidades de Claude', u:'https://support.claude.com/es/articles/11176164-usar-conectores-para-ampliar-las-capacidades-de-claude'}},

 {titulo:'Lista de permitidos de extensiones de escritorio', rec:'info', resumen:'Limita qué extensiones puede instalar el equipo.',
  que:'Es una lista de extensiones de escritorio aprobadas, que se llena una por una con el botón Agregar extensiones de escritorio. Cuando está en uso, los miembros solo pueden instalar las que estén en esa lista. Los controles de política empresarial a nivel de usuario y de máquina la anulan dentro de la aplicación.',
  criterio:'Mientras la lista esté vacía no restringe nada. En un equipo pequeño esto se gobierna hablando; a partir de quince personas, deja de ser opcional.',
  fuente:{t:'Configuración empresarial para Claude Desktop', u:'https://support.claude.com/es/articles/12622667-configuracion-empresarial-para-claude-desktop'}}
]});

S.push({
id:'habilidades', nombre:'Habilidades', quien:'Propietario de la organización',
intro:'Las habilidades compartidas con toda la organización suelen ser el activo más valioso de esta consola y el que menos respaldo tiene.',
items:[
 {titulo:'Qué son las habilidades y cómo se agregan', rec:'info', resumen:'Instrucciones guardadas que Claude usa cuando hacen falta.',
  que:'Una habilidad, o skill, es un instructivo guardado que Claude aplica solo cuando la tarea lo pide: cómo se escribe en la marca, el checklist de compliance antes de publicar, el formato exacto de una presentación. En vez de que alguien pegue el mismo prompt largo cada vez, queda escrito una sola vez y Claude lo usa cuando corresponde. Las habilidades de la organización quedan disponibles para todo el equipo sin que nadie las instale. La pantalla tiene buscador y tres pestañas, Biblioteca, Solicitudes y Política, y el único botón es Agregar, que sube un archivo comprimido con la definición. Necesitan que la ejecución de código esté habilitada.',
  criterio:'Lo que gana la organización: que el criterio deje de vivir en la cabeza de una persona. La habilidad de compliance revisa igual a las tres de la tarde que un domingo, y alguien que entra nuevo produce en marca desde el primer día. Es el activo más valioso de esta consola y el que menos respaldo tiene: descarga las que ya tienes y guárdalas en Git, porque ese archivo comprimido es lo único que te devuelve el trabajo si alguien borra una por error. En la pestaña Política define quién aprueba lo que se sube.',
  fuente:{t:'Aprovisionamiento y gestión de skills para su organización', u:'https://support.claude.com/es/articles/13119606-aprovisionamiento-y-gestion-de-skills-para-su-organizacion'}}
]});


S.push({
id:'directorio', nombre:'Directorio', quien:'Propietario de la organización',
intro:'Lo que se envía al catálogo público de Anthropic para que otras organizaciones lo instalen.',
items:[
 {titulo:'Qué es enviar algo al directorio', rec:'info', resumen:'Publicar tus servidores MCP o plugins para otras organizaciones.',
  que:'El directorio es el catálogo público de Claude. Desde aquí se envían los servidores MCP y los plugins que construyó el equipo: pasan por una revisión de Anthropic y, si los aprueban, aparecen en claude.ai/directory para que cualquier otra organización los instale. Son dos listas con su estado, y los únicos botones son Enviar un servidor y Enviar un plugin. Está en beta.',
  criterio:'Aquí hay una jugada de posicionamiento: aparecer en el directorio de Anthropic es distribución que no se compra con pauta. Antes de enviar nada, decide qué es producto abierto y qué es ventaja competitiva; lo que codifica tu criterio interno no va al directorio.',
  fuente:{t:'Explora habilidades, conectores y complementos en un directorio', u:'https://support.claude.com/es/articles/14328846-explora-habilidades-conectores-y-complementos-en-un-directorio'}}
]});
</script>

<script>
/* ---------- render ---------- */
const cont = document.getElementById('contenido');
const nav  = document.getElementById('nav');
const estado = {};

S.forEach(sec => {
  const a = document.createElement('a');
  a.className = 'nav'; a.dataset.sec = sec.id;
  a.setAttribute('role', 'link'); a.setAttribute('tabindex', '0');
  a.innerHTML = '<span>' + sec.nombre + '</span>' + (sec.aviso ? '<span class="pill alerta">' + sec.aviso + '</span>' : '');
  nav.appendChild(a);

  const s = document.createElement('section');
  s.id = sec.id;
  let html = '<div class="cab"><h2>' + sec.nombre + '</h2><span class="quien">' + sec.quien + '</span></div>';
  html += '<p class="intro">' + sec.intro + '</p>';

  sec.items.forEach((it, i) => {
    const key = sec.id + '-' + i;
    const encendido = it.rec === 'activar';
    estado[key] = { on: encendido, rec: it.rec, titulo: it.titulo, seccion: sec.nombre, tocado: false };
    const etiqueta = {activar:'Enciéndelo', desactivar:'Déjalo apagado', decidir:'Decide tú', info:'Sin interruptor'}[it.rec];
    const clase = 'm-' + it.rec;
    const bloqueado = it.rec === 'info' ? ' disabled' : '';

    html += '<div class="item" data-key="' + key + '" data-rec="' + it.rec + '">';
    html += '<div class="fila" role="button" tabindex="0" aria-expanded="false">';
    html += '<div class="txt"><h3>' + it.titulo + '<span class="marca ' + clase + '">' + etiqueta + '</span></h3><p>' + it.resumen + '</p></div>';
    html += '<div class="sw"><small>' + (it.rec === 'info' ? '' : (encendido ? 'Encendido' : 'Apagado')) + '</small>';
    html += '<button class="toggle" role="switch" aria-checked="' + encendido + '" aria-label="Interruptor de ' + it.titulo + '"' + bloqueado + '></button></div>';
    html += '</div>';

    html += '<div class="detalle">';
    html += '<h5>Qué hace</h5><p>' + it.que + '</p>';
    if (it.aviso)  html += '<div class="aviso">' + it.aviso + '</div>';
    if (it.nodoc)  html += '<div class="sinverificar">' + it.nodoc + '</div>';
    html += '<h5>Qué haría yo</h5><div class="criterio"><p>' + it.criterio + '</p></div>';
    if (it.fuente) html += '<div class="fuente"><span>Fuente</span><a href="' + it.fuente.u + '" target="_blank" rel="noopener">' + it.fuente.t + '</a></div>';
    html += '</div></div>';
  });

  s.innerHTML = html;
  cont.appendChild(s);
});

/* ---------- interacción ---------- */
cont.addEventListener('click', e => {
  const tg = e.target.closest('.toggle');
  if (tg) {
    e.stopPropagation();
    if (tg.disabled) return;
    const item = tg.closest('.item');
    const on = tg.getAttribute('aria-checked') === 'true';
    tg.setAttribute('aria-checked', String(!on));
    item.querySelector('.sw small').textContent = !on ? 'Encendido' : 'Apagado';
    estado[item.dataset.key].on = !on;
    estado[item.dataset.key].tocado = true;
    refrescar();
    return;
  }
  const fila = e.target.closest('.fila');
  if (fila) {
    const item = fila.closest('.item');
    const abierto = item.classList.toggle('abierto');
    fila.setAttribute('aria-expanded', String(abierto));
  }
});
cont.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('fila')) {
    e.preventDefault(); e.target.click();
  }
});

document.querySelectorAll('.filtro').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.filtro').forEach(x => x.setAttribute('aria-pressed', 'false'));
    b.setAttribute('aria-pressed', 'true');
    const f = b.dataset.f;
    document.querySelectorAll('.item').forEach(it => {
      it.classList.toggle('oculto', f !== 'todo' && it.dataset.rec !== f);
    });
    document.querySelectorAll('section').forEach(s => {
      const vis = s.querySelectorAll('.item:not(.oculto)').length;
      s.style.display = vis ? '' : 'none';
    });
  });
});

/* ---------- plan y progreso ---------- */
function refrescar() {
  const todos = Object.values(estado).filter(x => x.rec !== 'info');

  const pendientes = todos.filter(x => x.rec === 'decidir' && !x.tocado);
  const encender  = todos.filter(x => x.on && x.rec === 'activar');
  const apagar    = todos.filter(x => !x.on && x.rec === 'desactivar');

  let h = '<h2>Tu plan de acción</h2><ol>';
  h += '<li><b>Vacía la cola de solicitudes y asigna los asientos sueltos</b> antes de tocar nada más. Sin asientos libres, cada aprobación compra una licencia nueva.</li>';
  h += '<li><b>Cierra los dominios en estado Pendiente.</b> O los verificas o los retiras, porque a medias no protegen nada y ensucian la lista.</li>';
  if (encender.length) h += '<li><b>Enciende:</b> ' + encender.map(x => x.titulo).join(', ') + '.</li>';
  if (apagar.length)   h += '<li><b>Deja apagado:</b> ' + apagar.map(x => x.titulo).join(', ') + '.</li>';
  if (pendientes.length) h += '<li><b>Todavía sin decidir:</b> ' + pendientes.map(x => x.titulo).join(', ') + '.</li>';
  else h += '<li class="vacio">Ya no queda nada por decidir en esta guía.</li>';
  h += '</ol>';
  document.getElementById('plan').innerHTML = h;
}
const totalAjustes = document.getElementById('tAjustes');   // la portada ya no lo muestra
if (totalAjustes) totalAjustes.textContent = Object.keys(estado).length;
refrescar();

/* ---------- navegación interna sin salir de la página ---------- */
function irA(id){
  const s = document.getElementById(id);
  if (!s) return;
  s.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.getElementById('nav').addEventListener('click', e => {
  const a = e.target.closest('a.nav');
  if (!a) return;
  e.preventDefault();
  irA(a.dataset.sec);
});
document.getElementById('nav').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const a = e.target.closest('a.nav');
  if (!a) return;
  e.preventDefault();
  irA(a.dataset.sec);
  menu(false);
});

/* ---------- menú replegable ---------- */
const btnMenu = document.getElementById('abrirMenu');
const velo = document.getElementById('velo');
function menu(abrir){
  document.body.classList.toggle('menu', abrir);
  btnMenu.setAttribute('aria-expanded', String(abrir));
  btnMenu.textContent = abrir ? 'Cerrar' : 'Secciones';
}
btnMenu.addEventListener('click', () => menu(!document.body.classList.contains('menu')));
velo.addEventListener('click', () => menu(false));
document.getElementById('nav').addEventListener('click', () => menu(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') menu(false); });

/* ---------- nav activa ---------- */
const obs = new IntersectionObserver(es => {
  es.forEach(en => {
    if (en.isIntersecting) {
      document.querySelectorAll('.side a.nav').forEach(a => a.classList.remove('on'));
      const a = document.querySelector('.side a.nav[data-sec="' + en.target.id + '"]');
      if (a) a.classList.add('on');
    }
  });
}, { rootMargin: '-72px 0px -70% 0px' });
document.querySelectorAll('section').forEach(s => obs.observe(s));
</script>
</body>
</html>
